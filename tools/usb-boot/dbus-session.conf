<!DOCTYPE busconfig PUBLIC
  "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>session</type>
  <listen>unix:path=/run/reinvoke/dbus/system_bus_socket</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*"/>
    <allow receive_sender="*"/>
    <allow own="*"/>
  </policy>
  <limit name="max_incoming_bytes">16777216</limit>
  <limit name="max_outgoing_bytes">16777216</limit>
  <limit name="max_message_size">1048576</limit>
  <limit name="max_completed_connections">64</limit>
  <limit name="max_incomplete_connections">16</limit>
  <limit name="max_connections_per_user">64</limit>
  <limit name="max_names_per_connection">128</limit>
  <limit name="max_match_rules_per_connection">128</limit>
  <limit name="max_replies_per_connection">128</limit>
</busconfig>
